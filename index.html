<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorldSwitcher - 게임 소개</title>
    <style>
        body { font-family: '맑은 고딕', sans-serif; background-color: #121212; color: white; margin: 0; padding: 0; text-align: center; }
        header { padding: 20px; background-color: #1e1e1e; border-bottom: 2px solid #333; }
        .logo { max-width: 150px; border-radius: 20px; }
        .hero { padding: 50px 20px; }
        .hero h1 { color: #00ffff; font-size: 2.5em; }
        .hero p { font-size: 1.2em; color: #cccccc; line-height: 1.6; }
        .download-btn { display: inline-block; padding: 15px 30px; background-color: #aa00ff; color: white; text-decoration: none; font-weight: bold; border-radius: 8px; margin-top: 30px; font-size: 1.2em; transition: 0.3s; }
        .download-btn:hover { background-color: #d500f9; }
        .screenshots { display: flex; justify-content: center; gap: 20px; padding: 40px 20px; flex-wrap: wrap; background-color: #0a0a0a; }
        .screenshots img { max-width: 250px; border-radius: 15px; border: 3px solid #333; }
        .contact { padding: 50px 20px; background-color: #1e1e1e; }
        .contact a { display: inline-block; padding: 10px 20px; border: 2px solid #00ffff; color: #00ffff; text-decoration: none; font-size: 1.2em; border-radius: 5px; margin-top: 20px; }
        .contact a:hover { background-color: #00ffff; color: #000; }
    </style>
</head>
<body>

<header>
    <img src="logo.png" alt="WorldSwitcher 로고" class="logo">
</header>

<div class="hero">
    <h1>장애물을 돌파하며 가장 깊은 곳으로!</h1>
    <p>알맞은 색상으로 변신해 다가오는 장애물을 피하고<br>TOP 5 랭킹에 당신의 기록을 남겨보세요.</p>
    <!-- 스토어 주소가 나오면 아래 # 부분을 실제 주소로 바꾸면 됩니다 -->
    <a href="#" class="download-btn">구글 플레이 스토어 다운로드 (출시 예정)</a>
</div>

<div class="screenshots">
    <img src="expla.png" alt="게임 설명">
    <img src="stage01.jpg" alt="스테이지 1 게임화면">
    <img src="stage11.jpg" alt="스테이지 11 게임화면">
</div>

<div class="contact">
    <h2>개발자에게 문의하기</h2>
    <p>게임에 대한 의견이나 버그 제보는 아래 이메일로 보내주세요.</p>
    <a href="mailto:whitetruvil@gmail.com">whitetruvil@gmail.com 으로 메일 보내기</a>
</div>

</body>
</html>
